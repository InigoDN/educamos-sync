name: Sincronizar Educamos con Calendario

on:
  schedule:
    - cron: '0 5,13,19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para commitear el histórico y publicar la página

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install playwright beautifulsoup4 icalendar
          playwright install --with-deps chromium

      - name: Ejecutar script de sincronización
        env:
          EDUCAMOS_USER: ${{ secrets.EDUCAMOS_USER }}
          EDUCAMOS_PASS: ${{ secrets.EDUCAMOS_PASS }}
          ALUMNO_ID: ${{ secrets.ALUMNO_ID }}
        run: python sync_educamos.py

      # Guarda el histórico en tu repositorio para no perderlo nunca
      - name: Guardar base de datos histórica en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_tareas.json
          git commit -m "chore: actualizar histórico de tareas [skip ci]" || echo "Sin cambios en el histórico"
          git push

      # Publica el .ics con todos los eventos en GitHub Pages
      - name: Publicar calendario en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
